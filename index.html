<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webshop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <div class="container pb-5">
        <div class="card shadow-sm border-0 mb-5">
            <div class="card-header bg-white py-3">
                <h4 class="mb-0 fw-semibold">Felhasználók listája</h4>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th class="text-center">Név</th>
                                <th class="text-center">Email</th>
                                <th class="text-center">Város</th>
                                <th class="text-center">Telefon</th>
                                <th class="text-center">Szerepkör</th>
                                <th class="text-center">Műveletek</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-primary text-white py-3">
                        <h5 class="mb-0">Új felhasználó hozzáadása</h5>
                    </div>
                    <div class="card-body p-4">
                        <div class="mb-3">
                            <label for="name" class="form-label fw-medium">Név</label>
                            <input type="text" class="form-control" id="name" placeholder="Kovács János">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label fw-medium">Email cím</label>
                            <input type="email" class="form-control" id="email" placeholder="nev@pelda.hu">
                        </div>
                        <div class="mb-3">
                            <label for="city" class="form-label fw-medium">Város</label>
                            <input type="text" class="form-control" id="city" placeholder="Budapest">
                        </div>
                        <div class="mb-4">
                            <label for="phone" class="form-label fw-medium">Telefonszám</label>
                            <input type="text" class="form-control" id="phone" placeholder="+36 30 123 4567">
                        </div>
                        <button type="button" class="btn btn-primary w-100" onclick="submitUserForm(event)">Mentés</button>
                    </div>
                </div>
            </div>

            <div class="col-md-6" id="modify-section">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-warning text-dark py-3">
                        <h5 class="mb-0">Felhasználó módosítása</h5>
                    </div>
                    <div class="card-body p-4">
                        <input type="hidden" id="modify-id">
                        <div class="mb-3">
                            <label for="modify-name" class="form-label fw-medium">Név</label>
                            <input type="text" class="form-control" id="modify-name" placeholder="Válassz ki valakit a listából...">
                        </div>
                        <div class="mb-3">
                            <label for="modify-email" class="form-label fw-medium">Email cím</label>
                            <input type="email" class="form-control" id="modify-email" placeholder="nev@pelda.hu">
                        </div>
                        <div class="mb-3">
                            <label for="modify-city" class="form-label fw-medium">Város</label>
                            <input type="text" class="form-control" id="modify-city" placeholder="Budapest">
                        </div>
                        <div class="mb-4">
                            <label for="modify-phone" class="form-label fw-medium">Telefonszám</label>
                            <input type="text" class="form-control" id="modify-phone" placeholder="+36 30 123 4567">
                        </div>
                        <button type="button" class="btn btn-warning w-100 fw-medium" onclick="modifyUser()">Módosítások mentése</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
    <script src="main.js"></script>
</body>
</html>
